name: Git-native Vercel canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      deployments: read
    steps:
      - name: Check out production branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create and push empty canary commit
        id: commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "test: verify Git-native Vercel trigger [canary]"
          sha="$(git rev-parse HEAD)"
          if [ -n "$(git diff-tree --no-commit-id --name-only -r "$sha")" ]; then
            echo "Canary commit unexpectedly contains file changes" >&2
            exit 1
          fi
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for Production Deployment and verify public routes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANARY_SHA: ${{ steps.commit.outputs.sha }}
          SITE_ORIGIN: https://www.luminasmart.company
        shell: bash
        run: |
          node <<'NODE'
          const sha = process.env.CANARY_SHA;
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const origin = process.env.SITE_ORIGIN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'User-Agent': 'HowPublicMoneyWorks-GitNativeCanary/1.0',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function github(path) {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            if (!response.ok) throw new Error(`GitHub API HTTP ${response.status}`);
            return response.json();
          }
          async function publicStatus(path) {
            const response = await fetch(`${origin}${path}`, { redirect: 'follow' });
            return response.status;
          }
          let deployment = null;
          for (let attempt = 1; attempt <= 60; attempt += 1) {
            const deployments = await github(`/repos/${repository}/deployments?sha=${encodeURIComponent(sha)}&environment=Production&per_page=10`);
            deployment = deployments.find((item) => item.sha === sha && item.environment === 'Production');
            if (deployment) {
              const statuses = await github(`/repos/${repository}/deployments/${deployment.id}/statuses?per_page=10`);
              const latest = statuses[0];
              if (latest?.state === 'success') {
                console.log(`GIT_INTEGRATION_CANARY_DEPLOYMENT_PASS sha=${sha} deploymentId=${deployment.id}`);
                break;
              }
              if (['error', 'failure', 'inactive'].includes(latest?.state)) {
                throw new Error(`Production deployment failed with state ${latest.state}`);
              }
            }
            if (attempt === 60) throw new Error('Timed out waiting for Production Deployment');
            await sleep(5000);
          }
          for (const path of ['/', '/insights', '/sitemap.xml']) {
            const status = await publicStatus(path);
            if (status !== 200) throw new Error(`${path} returned HTTP ${status}`);
          }
          for (const path of [
            '/annual-financial-report-local-government',
            '/property-taxes-assessment-levy-bill',
            '/general-fund-vs-special-revenue-funds'
          ]) {
            const status = await publicStatus(path);
            if (status === 200) throw new Error(`Editorial route unexpectedly public: ${path}`);
          }
          console.log('GIT_INTEGRATION_CANARY_PUBLIC_VERIFICATION_PASS');
          NODE
