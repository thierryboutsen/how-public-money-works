name: Editorial readiness preflight

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
      timezone: 'America/Sao_Paulo'
    - cron: '17 8 * * 3'
      timezone: 'America/Sao_Paulo'
    - cron: '17 15 * * 5'
      timezone: 'America/Sao_Paulo'

permissions:
  contents: read

concurrency:
  group: editorial-readiness-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate published and review content
        run: npm run content:validate

      - name: Validate visual cover policy
        run: npm run content:test:visual

      - name: Verify production build
        run: npm run build

      - name: Check exact next slot and editorial buffer
        run: npm run editorial:preflight

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: editorial-readiness-preflight
          path: .editorial/preflight-latest.json
          if-no-files-found: warn
