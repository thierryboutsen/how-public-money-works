name: Editorial scheduled publication

on:
  workflow_dispatch:
    inputs:
      article:
        description: Optional English slug or translationKey to evaluate
        required: false
        type: string
      now:
        description: Optional ISO timestamp for deterministic dry-run scenarios
        required: false
        type: string
      recoveryDate:
        description: One-time recovery date for an exact reserved pair; never used by the normal cron
        required: false
        type: string
      execute:
        description: Request production execution; central fail-closed config still applies
        required: true
        default: false
        type: boolean
      canary:
        description: Run the empty-commit Git-native Vercel trigger canary
        required: true
        default: false
        type: boolean

  schedule:
    - cron: '0 9 * * 2,4'
      timezone: 'America/Sao_Paulo'

permissions:
  contents: read

concurrency:
  group: editorial-automation
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify automation policy and negative tests
        run: |
          npm run editorial:status
          npm run content:test:frontmatter
          npm run editorial:test
          npm run editorial:test:transaction
          # Inventory is an observability report here. Eligibility remains fail-closed
          # on the exact pair evaluated by editorial:run-slot below.
          npm run editorial:inventory -- --report-only
          npm run editorial:plan-week

  dry-run:
    needs: validation
    if: github.event_name == 'workflow_dispatch' && inputs.execute != true && inputs.canary != true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run fail-closed editorial dry run
        shell: bash
        env:
          ARTICLE: ${{ inputs.article }}
          NOW: ${{ inputs.now }}
          RECOVERY_DATE: ${{ inputs.recoveryDate }}
        run: |
          args=()
          if [ -n "$ARTICLE" ]; then
            args+=("$ARTICLE")
          fi
          if [ -n "$NOW" ]; then
            args+=("--now=$NOW")
          fi
          if [ -n "$RECOVERY_DATE" ]; then
            args+=("--recovery-date=$RECOVERY_DATE")
          fi
          npm run editorial:run-slot -- "${args[@]}"

      - name: Upload non-secret dry-run logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: editorial-dry-run-logs
          path: .editorial/logs/*.json
          if-no-files-found: warn

  git-native-canary:
    needs: validation
    if: github.event_name == 'workflow_dispatch' && inputs.canary == true
    permissions:
      contents: write
      deployments: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out production branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create and push empty canary commit
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "test: verify Git-native Vercel trigger [canary]"
          sha="$(git rev-parse HEAD)"
          if [ -n "$(git diff-tree --no-commit-id --name-only -r "$sha")" ]; then
            echo "Canary commit unexpectedly contains file changes" >&2
            exit 1
          fi
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for Production Deployment and verify public routes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANARY_SHA: ${{ steps.commit.outputs.sha }}
          SITE_ORIGIN: https://www.luminasmart.company
        shell: bash
        run: |
          node <<'NODE'
          const sha = process.env.CANARY_SHA;
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const origin = process.env.SITE_ORIGIN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'User-Agent': 'HowPublicMoneyWorks-GitNativeCanary/1.0',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function github(path) {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            if (!response.ok) throw new Error(`GitHub API HTTP ${response.status}`);
            return response.json();
          }
          async function publicStatus(path) {
            const response = await fetch(`${origin}${path}`, { redirect: 'follow' });
            return response.status;
          }
          for (let attempt = 1; attempt <= 60; attempt += 1) {
            const deployments = await github(`/repos/${repository}/deployments?sha=${encodeURIComponent(sha)}&environment=Production&per_page=10`);
            const deployment = deployments.find((item) => item.sha === sha && item.environment === 'Production');
            if (deployment) {
              const statuses = await github(`/repos/${repository}/deployments/${deployment.id}/statuses?per_page=10`);
              const latest = statuses[0];
              if (latest?.state === 'success') {
                console.log(`GIT_INTEGRATION_CANARY_DEPLOYMENT_PASS sha=${sha} deploymentId=${deployment.id}`);
                break;
              }
              if (['error', 'failure', 'inactive'].includes(latest?.state)) throw new Error(`Production deployment failed with state ${latest.state}`);
            }
            if (attempt === 60) throw new Error('Timed out waiting for Production Deployment');
            await sleep(5000);
          }
          for (const path of ['/', '/insights', '/sitemap.xml']) {
            const status = await publicStatus(path);
            if (status !== 200) throw new Error(`${path} returned HTTP ${status}`);
          }
          for (const path of ['/annual-financial-report-local-government', '/property-taxes-assessment-levy-bill', '/general-fund-vs-special-revenue-funds']) {
            const status = await publicStatus(path);
            if (status === 200) throw new Error(`Editorial route unexpectedly public: ${path}`);
          }
          console.log('GIT_INTEGRATION_CANARY_PUBLIC_VERIFICATION_PASS');
          NODE

  publication-runner:
    needs: validation
    if: (github.event_name == 'schedule' || inputs.execute == true) && inputs.canary != true
    permissions:
      contents: write
      deployments: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out production branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Git-native transactional publication adapter
        shell: bash
        env:
          ARTICLE: ${{ inputs.article }}
          RECOVERY_DATE: ${{ inputs.recoveryDate }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          args=("--execute")
          if [ -n "$ARTICLE" ]; then
            args+=("$ARTICLE")
          fi
          if [ -n "$RECOVERY_DATE" ]; then
            args+=("--recovery-date=$RECOVERY_DATE")
          fi
          npm run editorial:run-slot -- "${args[@]}"

      - name: Upload non-secret publication logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: editorial-dry-run-logs
          path: .editorial/logs/*.json
          if-no-files-found: warn

# The publication job may create normal commits on the default branch after all
# content gates pass. It never force-pushes and registries are committed only
# after the Vercel Git deployment and public verification succeed.
