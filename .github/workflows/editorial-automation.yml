name: Editorial scheduled publication

on:
  workflow_dispatch:
    inputs:
      article:
        description: Optional English slug or translationKey to evaluate
        required: false
        type: string
      now:
        description: Optional ISO timestamp for deterministic dry-run scenarios
        required: false
        type: string
      execute:
        description: Request production execution; central fail-closed config still applies
        required: true
        default: false
        type: boolean

  schedule:
    - cron: '0 9 * * 2,4'
      timezone: 'America/Sao_Paulo'

permissions:
  contents: read

concurrency:
  group: editorial-automation
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify automation policy and negative tests
        run: |
          npm run editorial:status
          npm run content:test:frontmatter
          npm run editorial:test
          npm run editorial:test:transaction
          # Inventory is an observability report here. Eligibility remains fail-closed
          # on the exact pair evaluated by editorial:run-slot below.
          npm run editorial:inventory -- --report-only
          npm run editorial:plan-week

  dry-run:
    needs: validation
    if: github.event_name == 'workflow_dispatch' && inputs.execute != true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run fail-closed editorial dry run
        shell: bash
        env:
          ARTICLE: ${{ inputs.article }}
          NOW: ${{ inputs.now }}
        run: |
          args=()
          if [ -n "$ARTICLE" ]; then
            args+=("$ARTICLE")
          fi
          if [ -n "$NOW" ]; then
            args+=("--now=$NOW")
          fi
          npm run editorial:run-slot -- "${args[@]}"

      - name: Upload non-secret dry-run logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: editorial-dry-run-logs
          path: .editorial/logs/*.json
          if-no-files-found: warn

  publication-runner:
    needs: validation
    if: github.event_name == 'schedule' || inputs.execute == true
    permissions:
      contents: write
      deployments: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out production branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Git-native transactional publication adapter
        shell: bash
        env:
          ARTICLE: ${{ inputs.article }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          args=("--execute")
          if [ -n "$ARTICLE" ]; then
            args+=("$ARTICLE")
          fi
          npm run editorial:run-slot -- "${args[@]}"

      - name: Upload non-secret publication logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: editorial-dry-run-logs
          path: .editorial/logs/*.json
          if-no-files-found: warn

# The publication job may create normal commits on the default branch after all
# content gates pass. It never force-pushes and registries are committed only
# after the Vercel Git deployment and public verification succeed.
