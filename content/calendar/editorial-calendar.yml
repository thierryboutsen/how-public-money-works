# Política editorial dinâmica.
# Este arquivo define cadência e processo; não fixa artigos futuros.
# Vocabulário dos slots: docs/editorial/STATUS_VOCABULARY.md

cadence:
  postsPerWeek: 2
  preferredDays:
    - Tuesday
    - Thursday
  planningWindowWeeks: 2
  minimumApprovedBuffer: 4

generationPolicy:
  mode: ai_assisted
  topicsAreGeneratedDynamically: true
  fixedCalendar: false
  humanApprovalRequired: true
  publishAutomatically: false

weeklyWorkflow:
  Monday: "Generate or review ideas, choose weekly topics, prepare briefs"
  Tuesday: "Publish approved article A manually after preview"
  Wednesday: "Review article B and prepare final package"
  Thursday: "Publish approved article B manually after preview"
  Friday: "Review performance, update registry, prepare next cycle"

slots:
  # status válido para slots: open, selected, skipped, filled
  - slot: Tuesday
    status: open
    articleSlug: null
    selectionRule: "AI proposes a topic after checking article registry and topic registry"
  - slot: Thursday
    status: open
    articleSlug: null
    selectionRule: "AI proposes a complementary topic with a different angle"

rules:
  - "No topic is final until approved by a human"
  - "No draft moves to content/posts until approved"
  - "No article may repeat an existing topic-angle signature"
  - "The AI must check article-registry and topic-registry before proposing a new article"
  - "If quality is not high enough, skip the slot instead of publishing weak content"
  - "A slot may remain open when no sufficiently strong topic is approved"
  - "Public content must be written in English"

# Sementes de geração, não calendário final.
# Podem ser ignoradas, substituídas, combinadas ou reformuladas após a checagem dos registros.
