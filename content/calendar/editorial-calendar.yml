rules:
  - No topic becomes a brief or draft without the required human topic and brief approvals
  - Publication review is preferably human; silence may use the auto-publish fallback only after cutoff and only when every gate passes
  - Human rejection or requested changes always block auto-publish
  - No article may repeat an existing topic-angle signature
  - The AI must check article-registry and topic-registry before proposing a new article
  - If quality is not high enough, skip the slot instead of publishing weak content
  - A slot may remain open when no sufficiently strong topic is approved
  - Public content must be written in English
