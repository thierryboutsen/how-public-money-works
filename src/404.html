<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Page Not Found — Lumina Smart Strategies</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/shared/base.css" />
<style>
  body {
    background: #0C1A2C;
    color: #FBF7EC;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .error-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 40px;
  }
  .error-content h1 {
    font-family: var(--font-display);
    font-size: 120px;
    font-weight: 400;
    color: var(--gold-deep);
    margin: 0 0 20px 0;
    line-height: 1;
  }
  .error-content h2 {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 400;
    color: #FBF7EC;
    margin-bottom: 24px;
  }
  .error-content p {
    font-size: 16px;
    color: #c5bdad;
    max-width: 400px;
    margin: 0 auto 40px auto;
    line-height: 1.6;
  }
  .error-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
  }
  .btn-gold {
    background: var(--gold-deep);
    color: #FFFFFF;
    border: 1px solid var(--gold-deep);
    padding: 12px 24px;
    font-family: var(--font-ui);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    font-weight: 600;
    text-decoration: none;
    transition: all 180ms ease;
  }
  .btn-gold:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: #0C1A2C;
  }
  .btn-outline {
    background: transparent;
    color: var(--gold-soft);
    border: 1px solid var(--gold);
    padding: 12px 24px;
    font-family: var(--font-ui);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
    transition: all 180ms ease;
  }
  .btn-outline:hover {
    background: var(--gold);
    color: #0C1A2C;
  }
</style>
</head>
<body>

<nav class="nav civic" style="background: rgba(12,26,44,0.94); border-bottom: 1px solid rgba(197,168,120,0.15);">
  <div class="brand">
    <span class="brand-mark" style="color: var(--gold-deep);">L</span>
    <span class="brand-name" style="color: #FBF7EC;">Lumina Smart Strategies</span>
  </div>
</nav>

<div class="error-container">
  <div class="error-content">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <div class="error-actions">
      <a href="/index.html" class="btn-gold">Return to Home</a>
      <a href="/insights.html" class="btn-outline">Read Eliana's Blog</a>
    </div>
  </div>
</div>

</body>
</html>
