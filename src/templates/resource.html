<!DOCTYPE html>
<html lang="{{htmlLanguage}}" data-page-type="resource">
<head>
<meta charset="UTF-8" />
<title>{{documentTitle}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="{{metaDescription}}" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="{{canonicalUrl}}" />
{{alternateLinks}}
<meta property="og:type" content="website" />
<meta property="og:url" content="{{canonicalUrl}}" />
<meta property="og:title" content="{{documentTitle}}" />
<meta property="og:description" content="{{metaDescription}}" />
<meta property="og:image" content="{{ogImageUrl}}" />
<meta property="og:site_name" content="{{siteName}}" />
<meta property="og:locale" content="{{ogLocale}}" />
{{ogAlternateLocaleMeta}}
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{documentTitle}}" />
<meta name="twitter:description" content="{{metaDescription}}" />
<meta name="twitter:image" content="{{ogImageUrl}}" />
<link rel="stylesheet" href="{{sharedCssPath}}" />
{{jsonLdScript}}
</head>
<body class="resource-page" data-content-language="{{htmlLanguage}}">
<main>
  <section class="resource-masthead">
    <div class="resource-shell">
      <div class="resource-topline">
        <a href="/">Lumina Smart Strategies</a>
        {{languageSwitchHtml}}
      </div>
      <div class="resource-label">{{category}}</div>
      <h1>{{title}}</h1>
      <p class="resource-subtitle">{{subtitle}}</p>
      <p class="resource-byline">{{byline}}</p>
    </div>
  </section>
  <section class="resource-body">
    <div class="resource-shell resource-layout">
      <article class="resource-content">
        {{bodyHtml}}
        {{referencesHtml}}
      </article>
      {{updatedAtHtml}}
    </div>
  </section>
</main>
<footer class="foot"><div class="foot-bottom"><span>{{siteName}}</span><span>How Public Money Works</span></div></footer>
<script src="{{sharedJsPath}}"></script>
<script>
  document.querySelectorAll('[data-glossary-search], [data-glossary-filter]').forEach(function (control) {
    control.addEventListener('input', filterGlossary);
    control.addEventListener('click', filterGlossary);
  });
  function filterGlossary(event) {
    var root = document.querySelector('.glossary-entries');
    if (!root) return;
    var search = (document.querySelector('[data-glossary-search]')?.value || '').toLowerCase().trim();
    var active = document.querySelector('[data-glossary-filter].on');
    var category = active ? active.getAttribute('data-glossary-filter') : 'all';
    if (event && event.target.matches('[data-glossary-filter]')) {
      document.querySelectorAll('[data-glossary-filter]').forEach(function (button) {
        button.classList.remove('on');
        button.setAttribute('aria-pressed', 'false');
      });
      event.target.classList.add('on');
      event.target.setAttribute('aria-pressed', 'true');
      category = event.target.getAttribute('data-glossary-filter');
    }
    root.querySelectorAll('[data-glossary-term]').forEach(function (entry) {
      var matchesSearch = !search || entry.getAttribute('data-glossary-term').indexOf(search) >= 0;
      var matchesCategory = category === 'all' || entry.getAttribute('data-glossary-category') === category;
      entry.hidden = !(matchesSearch && matchesCategory);
    });
  }
</script>
</body>
</html>
